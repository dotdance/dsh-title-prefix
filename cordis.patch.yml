# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# 这是本插件的 bundle 层（package.json 的 dsh.bundle.patch 指向本文件）。
# 安装：dsh plugin --profile web add link:/Users/go/proj/dsh-title-prefix
#   —— 该命令跑 pnpm 安装，并把 dsh-title-prefix 追加进 profile 的 dsh.profile.bundles；
#      DSH 启动时按 bundles 顺序叠加各层，本文件负责插入下面这一条。
# 关闭：在市场界面里停用，或在 profile 的 cordis.patch.yml 里写 `- id: dsh-title-prefix` + `disabled: true`。
- insert:
    - id: dsh-title-prefix
      name: 'dsh-title-prefix'
